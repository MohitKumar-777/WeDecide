services:
  - type: web
    name: wedecide-api
    env: docker
    dockerContext: .
    dockerfilePath: apps/api/Dockerfile
    plan: free # Change to 'starter' or higher for production
    healthCheckPath: /health # Ensure your API has a /health endpoint
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: UPSTASH_REDIS_URL
        sync: false
      - key: MSG91_AUTH_KEY
        sync: false
      - key: MSG91_TEMPLATE_ID
        sync: false
